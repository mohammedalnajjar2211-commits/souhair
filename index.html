<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SOUHAIR BEAUTY 🫆</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:30px;
background:linear-gradient(180deg,#ffffff 0%,#efefef 60%,#d9d9d9 100%);
}

.card{

width:100%;
max-width:430px;

padding:35px 25px;

border-radius:30px;

background:rgba(255,255,255,.45);

backdrop-filter:blur(18px);

box-shadow:0 15px 40px rgba(0,0,0,.12);

text-align:center;

animation:fade .8s ease;
}

.avatar{

width:140px;
height:140px;

border-radius:50%;

object-fit:cover;

margin-bottom:18px;

border:5px solid white;

box-shadow:0 10px 25px rgba(0,0,0,.15);
}

h1{

font-size:28px;

margin-bottom:30px;

color:#111;
}

.btn{

display:flex;

align-items:center;

justify-content:center;

gap:12px;

width:100%;

margin:15px 0;

padding:18px;

border-radius:999px;

background:#111;

color:white;

font-size:18px;

text-decoration:none;

transition:.3s;

box-shadow:0 10px 20px rgba(0,0,0,.15);
}

.btn:hover{

transform:translateY(-4px);

background:#2b2b2b;

box-shadow:0 15px 30px rgba(0,0,0,.25);
}

.btn i{

font-size:20px;
}

@keyframes fade{

from{
opacity:0;
transform:translateY(25px);
}

to{
opacity:1;
transform:translateY(0);
}

}

</style>

</head>

<body>

<main class="card">

<img
loading="lazy"
class="avatar"
src="https://ugc.production.linktr.ee/e2b9cf0f-c613-4f8c-8101-d99514302e57_WhatsApp-Image-2026-04-06-at-14.06.03.jpeg?io=true&size=avatar-v3_0"
alt="SOUHAIR BEAUTY">

<h1>SOUHAIR BEAUTY 🫆</h1>

<a href="#" class="btn">
<i class="fa-solid fa-cart-shopping"></i>
اطلب الآن
</a>

<a href="#" class="btn">
<i class="fa-solid fa-star"></i>
زر رقم 2
</a>

<a href="#" class="btn">
<i class="fa-solid fa-heart"></i>
زر رقم 3
</a>

<a href="#" class="btn">
<i class="fa-solid fa-phone"></i>
زر رقم 4
</a>

</main>

</body>
</html>
